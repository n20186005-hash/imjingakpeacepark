    </g>
    <g stroke="#f0a85a" transform="translate(292 140)">
      <path d="M0 0 L0 -62"/>
      <path d="M0 0 L58 -16"/>
      <path d="M0 0 L38 52"/>
      <path d="M0 0 L-54 34"/>
