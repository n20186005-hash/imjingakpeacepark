    </g>
  </g>
  <!-- Pinwheel stems -->
  <g stroke="#7fb2d6" stroke-width="12" stroke-linecap="round">
    <path d="M148 168 L148 356"/>
    <path d="M292 140 L292 356"/>
  </g>
  <!-- Peace ring / horizon -->
  <path d="M104 372 Q256 316 408 372" fill="none" stroke="#7fb2d6" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8"/>
