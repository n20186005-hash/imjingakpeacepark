  </defs>
  <rect width="512" height="512" rx="104" fill="url(#sky)"/>
  <!-- Wind Hill pinwheels -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <g stroke="#f4d58a" transform="translate(148 168)">
      <path d="M0 0 L0 -74"/>
